name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dukaan-demo.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dukaan-demo.apk --title "Demo Dukaan APK" --notes "Latest build of the demo Android app."
